<!-- ===== 500 LUCKY GEMS (play-money slot module) — paste before </body> ===== -->
<style>
#lgOverlay{position:fixed;inset:0;z-index:9999;display:none;justify-content:center;background:#05150b;font-family:system-ui,Arial,sans-serif}
#lgOverlay.open{display:flex}
.lg-app{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;overflow:hidden;color:#fff;
 background:radial-gradient(ellipse at 50% 0,#2f7a3d 0,#14471f 45%,#06210e 100%)}
.lg-app:before{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;
 background:repeating-linear-gradient(90deg,transparent 0 38px,#000 38px 40px),repeating-linear-gradient(0deg,transparent 0 38px,#000 38px 40px)}
.lg-top{position:relative;display:flex;align-items:center;gap:8px;padding:10px;background:linear-gradient(#3a2a05,#1d1403);border-bottom:2px solid #d4a017}
.lg-exit{background:#7a1010;color:#fff;border:1px solid #f0c040;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
.lg-bal{flex:1;display:flex;align-items:center;gap:6px;background:#000a;border:1px solid #d4a017;border-radius:20px;padding:5px 10px;font-weight:800;color:#ffd75e}
.lg-coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff2a8,#d4a017 60%,#8a6508);display:inline-block}
.lg-plus{width:28px;height:28px;border-radius:50%;border:0;background:#1fb84a;color:#fff;font-size:20px;font-weight:900;cursor:pointer;line-height:1}
.lg-snd{background:none;border:1px solid #d4a017;color:#ffd75e;border-radius:8px;padding:5px 8px;cursor:pointer}
.lg-title{position:relative;text-align:center;font-weight:900;font-size:22px;letter-spacing:1px;margin:10px 0 2px;color:#ffd75e;text-shadow:0 0 12px #f5b800,0 2px 0 #5a3d00}
.lg-sub{position:relative;text-align:center;font-size:11px;opacity:.8;margin-bottom:8px}
.lg-mid{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;min-height:0}
.lg-frame{padding:10px;border-radius:16px;background:linear-gradient(145deg,#f7d66a,#a8780c 50%,#f7d66a);box-shadow:0 0 25px #f5b80088,inset 0 0 8px #000}
.lg-reels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#0b1a10;padding:6px;border-radius:10px}
.lg-reel{display:grid;grid-template-rows:repeat(3,1fr);gap:6px}
.lg-cell{width:76px;height:76px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:44px;
 background:radial-gradient(circle,#27402e,#0f2015);border:1px solid #3f6b4a;transition:transform .15s}
.lg-cell svg{width:52px;height:52px;filter:drop-shadow(0 0 5px currentColor)}
.lg-cell.spin{filter:blur(2px);transform:translateY(3px)}
.lg-cell.land{animation:lgLand .25s}
@keyframes lgLand{0%{transform:translateY(-14px)}60%{transform:translateY(5px)}100%{transform:none}}
.lg-cell.win{border-color:#ffe066;background:radial-gradient(circle,#7a5a10,#2a1d03);animation:lgGlow .5s infinite alternate;z-index:2}
@keyframes lgGlow{from{box-shadow:0 0 6px #ffd75e}to{box-shadow:0 0 22px 4px #fff2a8}}
.lg-pillar{display:flex;flex-direction:column;gap:10px}
.lg-badge{width:62px;padding:8px 2px;text-align:center;font-weight:900;font-size:11px;border-radius:10px;border:2px solid #7a5a10;
 background:#1d1403;color:#8a7a50;transition:.25s}
.lg-badge b{display:block;font-size:17px}
.lg-badge.hit{color:#fff;border-color:#ffe066;background:linear-gradient(#e0a800,#8a5a00);box-shadow:0 0 22px #ffd75e;transform:scale(1.15)}
.lg-msg{position:relative;text-align:center;height:22px;font-weight:700;color:#ffd75e;font-size:14px;margin:4px 0}
.lg-deck{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 18px;background:linear-gradient(#2a1d03,#120c01);border-top:2px solid #d4a017}
.lg-box{flex:1;text-align:center}
.lg-box small{display:block;font-size:10px;letter-spacing:1px;color:#e8c866}
.lg-val{background:#000;border:1px solid #d4a017;border-radius:8px;padding:6px;font-weight:900;font-size:18px;color:#7dff9a;font-family:monospace;margin-top:3px}
.lg-bet{display:flex;align-items:center;gap:4px;margin-top:3px}
.lg-bet button{width:30px;height:34px;border-radius:8px;border:1px solid #d4a017;background:#3a2a05;color:#ffd75e;font-size:18px;font-weight:900;cursor:pointer}
.lg-bet .lg-val{flex:1;margin:0;color:#ffd75e}
.lg-spin{width:92px;height:92px;border-radius:50%;border:4px solid #f7d66a;font-weight:900;font-size:18px;color:#fff;cursor:pointer;letter-spacing:1px;
 background:radial-gradient(circle at 35% 25%,#7dff9a,#17a840 55%,#0b5a20);box-shadow:0 0 22px #2cff6a99,0 6px 0 #064015,inset 0 4px 8px #fff6;text-shadow:0 2px 3px #000}
.lg-spin:active{transform:translateY(5px);box-shadow:0 0 22px #2cff6a99,0 1px 0 #064015}
.lg-spin:disabled,.lg-bet button:disabled{filter:grayscale(.8);opacity:.6;cursor:not-allowed}
.lg-fx{position:absolute;pointer-events:none;font-size:20px;animation:lgFx 1s ease-out forwards;z-index:5}
@keyframes lgFx{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.lg-flash{position:absolute;inset:0;background:#fff3;opacity:0;pointer-events:none;animation:lgFlash .5s}
@keyframes lgFlash{0%{opacity:.8}100%{opacity:0}}
.lg-pay{position:relative;font-size:10px;text-align:center;opacity:.75;padding-bottom:4px}
</style>

<div id="lgOverlay" aria-hidden="true">
 <div class="lg-app" id="lgApp">
  <div class="lg-top">
   <button class="lg-exit" onclick="closeLuckyGems()">&larr; Exit</button>
   <div class="lg-bal"><span class="lg-coin"></span><span id="lgBal">0</span></div>
   <button class="lg-plus" id="lgPlus" title="Get free play coins" onclick="LG.refill()">+</button>
   <button class="lg-snd" id="lgSnd" onclick="LG.toggleSound()">🔊</button>
  </div>
  <div class="lg-title">500 LUCKY GEMS</div>
  <div class="lg-sub">Play-money game &bull; virtual coins only</div>
  <div class="lg-mid">
   <div class="lg-frame"><div class="lg-reels" id="lgReels"></div></div>
   <div class="lg-pillar">
    <div class="lg-badge" id="lgB5"><b>5x</b>NUDGE</div>
    <div class="lg-badge" id="lgB100"><b>100x</b>SUPER</div>
    <div class="lg-badge" id="lgB500"><b>500x</b>MEGA</div>
   </div>
  </div>
  <div class="lg-msg" id="lgMsg">Press SPIN</div>
  <div class="lg-pay">3 in a line: 💎5x · ♦8x · ◆12x · 👑25x · 🦁50x (line stake = bet ÷ 5, 🦁 is wild)</div>
  <div class="lg-deck">
   <div class="lg-box"><small>TOTAL BET</small>
    <div class="lg-bet"><button id="lgMinus" onclick="LG.bet(-1)">−</button><div class="lg-val" id="lgBet">10</div><button id="lgUp" onclick="LG.bet(1)">+</button></div>
   </div>
   <button class="lg-spin" id="lgSpinBtn" onclick="spinLuckyGems()">SPIN</button>
   <div class="lg-box"><small>LAST WIN</small><div class="lg-val" id="lgWin">0.00</div></div>
  </div>
 </div>
</div>

<script>
(function(){
 var BETS=[5,10,20,50,100,200], KEY='lg_play_coins';
 var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,4,8],[2,4,6]]; // cell index = row*3+col
 var SYM=[
  {id:'sap',c:'#3aa0ff',m:5,w:30},{id:'rub',c:'#ff3b4e',m:8,w:25},{id:'eme',c:'#2fe07a',m:12,w:20},
  {id:'crown',m:25,w:12},{id:'wild',m:50,w:6}];
 var TOTALW=SYM.reduce(function(a,s){return a+s.w},0);

 // ---- Hooks: connect these to your own app (all optional) ----
 var hooks={
  getBalance:function(){var v=parseFloat(localStorage.getItem(KEY));if(isNaN(v)){v=1000;localStorage.setItem(KEY,v)}return v},
  setBalance:function(v){localStorage.setItem(KEY,v)},
  onSettle:function(rec){/* rec={gameType,betAmount,wonAmount}; send to your server here if you want */},
  onRecharge:null // set to a function to open your own cashier instead of the free refill
 };

 var st={bet:1,spinning:false,sound:true,grid:[0,0,0,0,0,0,0,0,0],cells:[],ctx:null};
 function $(i){return document.getElementById(i)}
 function bal(){return hooks.getBalance()}
 function fmt(n){return n.toFixed(2)}
 function rnd(){var r=Math.random()*TOTALW;for(var i=0;i<SYM.length;i++){r-=SYM[i].w;if(r<0)return i}return 0}

 function svg(s){
  if(s.id==='crown')return '<span style="font-size:42px">👑</span>';
  if(s.id==='wild')return '<span style="font-size:42px">🦁</span>';
  var f=s.id==='sap'?'M12 2l8 7-8 13L4 9z':s.id==='rub'?'M12 2l9 10-9 10L3 12z':'M7 3h10l5 9-5 9H7l-5-9z';
  return '<svg viewBox="0 0 24 24" style="color:'+s.c+'"><path d="'+f+'" fill="'+s.c+'" stroke="#fff" stroke-width="1.2"/><path d="M12 2v20M4 9h16" stroke="#fff6" stroke-width=".8"/></svg>';
 }
 function put(i,sym){st.cells[i].innerHTML=svg(SYM[sym])}

 function build(){
  var R=$('lgReels');R.innerHTML='';st.cells=[];
  for(var c=0;c<3;c++){var col=document.createElement('div');col.className='lg-reel';
   for(var r=0;r<3;r++){var d=document.createElement('div');d.className='lg-cell';col.appendChild(d);st.cells[r*3+c]=d}
   R.appendChild(col)}
  for(var i=0;i<9;i++){st.grid[i]=rnd();put(i,st.grid[i])}
 }

 // ---- Sound (Web Audio) ----
 function tone(f,d,type,v,delay){
  if(!st.sound)return;
  try{
   st.ctx=st.ctx||new (window.AudioContext||window.webkitAudioContext)();
   var t=st.ctx.currentTime+(delay||0),o=st.ctx.createOscillator(),g=st.ctx.createGain();
   o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
   o.connect(g);g.connect(st.ctx.destination);o.start(t);o.stop(t+d);
  }catch(e){}
 }
 function sfxWin(big){[523,659,784,1047].concat(big?[1319,1568]:[]).forEach(function(f,i){tone(f,.25,'triangle',.1,i*.09)})}

 function refresh(){
  $('lgBal').textContent=fmt(bal());$('lgBet').textContent=BETS[st.bet];
  $('lgMinus').disabled=st.spinning||st.bet===0;$('lgUp').disabled=st.spinning||st.bet===BETS.length-1;
  $('lgSpinBtn').disabled=st.spinning;$('lgPlus').disabled=st.spinning;
 }
 function msg(t){$('lgMsg').textContent=t}

 function fx(cellIdx){
  var app=$('lgApp'),b=st.cells[cellIdx].getBoundingClientRect(),a=app.getBoundingClientRect(),icons=['✨','⭐','💛','✦'];
  for(var i=0;i<6;i++){var p=document.createElement('span');p.className='lg-fx';p.textContent=icons[i%4];
   p.style.left=(b.left-a.left+b.width/2)+'px';p.style.top=(b.top-a.top+b.height/2)+'px';
   p.style.setProperty('--dx',(Math.random()*120-60)+'px');p.style.setProperty('--dy',(Math.random()*120-60)+'px');
   app.appendChild(p);setTimeout(function(q){return function(){q.remove()}}(p),1000)}
 }

 function evaluate(){
  var wins=[],lineStake=BETS[st.bet]/5,total=0;
  LINES.forEach(function(L){
   var syms=L.map(function(i){return st.grid[i]}),base=-1;
   for(var k=0;k<3;k++){if(SYM[syms[k]].id!=='wild'){base=syms[k];break}}
   if(base===-1)base=4; // all wild
   var ok=syms.every(function(s){return s===base||SYM[s].id==='wild'});
   if(ok){var pay=lineStake*SYM[base].m;total+=pay;wins.push({line:L,pay:pay})}
  });
  return {wins:wins,total:total};
 }

 function pickMultiplier(){
  var r=Math.random();
  if(r<.002)return {m:500,id:'lgB500'};
  if(r<.012)return {m:100,id:'lgB100'};
  if(r<.10)return {m:5,id:'lgB5'};
  return null;
 }

 function settle(won){
  var rec={gameType:'500_LUCKY_GEMS',betAmount:BETS[st.bet],wonAmount:won};
  try{hooks.onSettle(rec)}catch(e){}
 }

 // ---- Public API ----
 window.openLuckyGems=function(){$('lgOverlay').classList.add('open');$('lgOverlay').setAttribute('aria-hidden','false');
  if(!st.cells.length)build();$('lgWin').textContent='0.00';msg('Press SPIN');refresh()};
 window.closeLuckyGems=function(){if(st.spinning)return;$('lgOverlay').classList.remove('open');$('lgOverlay').setAttribute('aria-hidden','true')};

 window.spinLuckyGems=function(){
  if(st.spinning)return;
  var bet=BETS[st.bet];
  if(bal()<bet){msg('Not enough coins — tap + for free play coins');tone(180,.3,'sawtooth',.08);return}
  st.spinning=true;hooks.setBalance(+(bal()-bet).toFixed(2));
  $('lgWin').textContent='0.00';msg('Spinning...');
  st.cells.forEach(function(c){c.classList.remove('win','land');c.classList.add('spin')});
  ['lgB5','lgB100','lgB500'].forEach(function(i){$(i).classList.remove('hit')});
  refresh();
  var final=[];for(var i=0;i<9;i++)final.push(rnd());
  var iv=setInterval(function(){
   for(var i=0;i<9;i++){if(st.cells[i].classList.contains('spin'))put(i,rnd())}
   tone(300+Math.random()*100,.04,'square',.02);
  },70);
  [0,1,2].forEach(function(col){
   setTimeout(function(){
    for(var r=0;r<3;r++){var i=r*3+col;st.grid[i]=final[i];put(i,final[i]);
     st.cells[i].classList.remove('spin');st.cells[i].classList.add('land')}
    tone(220,.12,'triangle',.12);
    if(col===2){clearInterval(iv);setTimeout(finish,300)}
   },900+col*450);
  });
 };

 function finish(){
  var res=evaluate(),won=res.total,mult=null;
  if(won>0){
   mult=pickMultiplier();
   if(mult){won*=mult.m;$(mult.id).classList.add('hit')}
   res.wins.forEach(function(w){w.line.forEach(function(i){st.cells[i].classList.add('win');fx(i)})});
   var f=document.createElement('div');f.className='lg-flash';$('lgApp').appendChild(f);setTimeout(function(){f.remove()},500);
   won=+won.toFixed(2);hooks.setBalance(+(bal()+won).toFixed(2));
   $('lgWin').textContent=fmt(won);
   msg((mult?mult.m+'x BONUS! ':'')+'You won '+fmt(won)+'!');
   sfxWin(!!mult||won>=BETS[st.bet]*10);
  } else msg('No win — try again');
  settle(won);
  st.spinning=false;refresh();
 }

 window.LG={
  hooks:hooks,
  bet:function(d){if(st.spinning)return;st.bet=Math.max(0,Math.min(BETS.length-1,st.bet+d));tone(500,.05,'square',.05);refresh()},
  refill:function(){
   if(st.spinning)return;
   if(typeof hooks.onRecharge==='function'){hooks.onRecharge();return}
   hooks.setBalance(+(bal()+1000).toFixed(2));msg('+1000 free play coins');tone(880,.15,'triangle',.1);refresh();
  },
  toggleSound:function(){st.sound=!st.sound;$('lgSnd').textContent=st.sound?'🔊':'🔇'}
 };
})();
</script>
<!-- Usage: <button onclick="openLuckyGems()">Play 500 Lucky Gems</button> -->
